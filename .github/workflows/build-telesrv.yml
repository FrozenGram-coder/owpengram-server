name: Build telesrv

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build telesrv
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -o telesrv ./cmd/telesrv
          file telesrv
          ls -lh telesrv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telesrv-linux-amd64
          path: telesrv
